[package]
name = "pydmg-neogeo-jni"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[lib]
name = "pydmg_neogeo_jni"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
pydmg-neogeo = { path = "..", default-features = false }
jni = { version = "0.21", default-features = false }
log = "0.4"
android_logger = "0.14"
anyhow = "1.0"
once_cell = "1.21"
# AAudio is linked directly via `extern "C" { #[link(name = "aaudio")] }`
# in `src/aaudio_stream.rs`. `libaaudio.so` ships with every Android
# 8.0+ device so there is no separate Rust dependency to pull in
# (ndk-sys would work but locks us to a specific ndk-sys / NDK-r pair,
# which is friction we don't need for 5 function pointers).

# Note: profile settings live at the workspace root (../Cargo.toml).
# Cargo ignores [profile.*] in non-root members.
