# JVM heap kept modest so the build still works on machines/CI runners
# with limited RAM. Override locally with `-Dorg.gradle.jvmargs=...` if
# you have a beefier dev box and want a faster build.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.configureondemand=false
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
